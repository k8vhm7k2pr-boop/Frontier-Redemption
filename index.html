<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frontier Redemption</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Georgia,serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#20321d}
#tip{position:fixed;left:50%;top:10px;transform:translateX(-50%);color:#f5e4b8;background:#24190ecc;border:1px solid #8e6b35;padding:7px 12px;border-radius:8px;font-size:13px;z-index:4;text-align:center}
#controls{position:fixed;inset:0;pointer-events:none;z-index:3}
.stick{position:absolute;left:22px;bottom:24px;width:118px;height:118px;border:2px solid #ead7ad66;border-radius:50%;background:#0003;pointer-events:auto}
.knob{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#ead7ad99}
.btn{position:absolute;border:1px solid #ead7ad88;color:#fff;background:#1b120dcc;border-radius:50%;display:flex;align-items:center;justify-content:center;font:bold 16px Georgia;pointer-events:auto;user-select:none}
#fire{right:22px;bottom:34px;width:74px;height:74px}
#horse{right:108px;bottom:94px;width:58px;height:58px}
#act{right:24px;bottom:122px;width:58px;height:58px}
#map{right:22px;top:70px;width:54px;height:54px;border-radius:10px}
#menu{right:22px;top:132px;width:54px;height:54px;border-radius:10px}
#overlay{position:fixed;inset:0;background:#100c08e8;color:#f6e7c3;z-index:5;display:none;padding:24px;box-sizing:border-box;overflow:auto}
#overlay h1{margin-top:5px;color:#d8a44a}
.card{max-width:680px;margin:auto;background:#21160e;border:1px solid #8e6b35;padding:20px;border-radius:12px}
button{background:#9d6b2e;color:#fff;border:0;border-radius:7px;padding:12px 16px;font-weight:bold}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tip">FRONTIER REDEMPTION • Chapter I: The Long Road</div>
<div id="controls">
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="btn" id="fire">FIRE</div>
  <div class="btn" id="horse">HORSE</div>
  <div class="btn" id="act">ACT</div>
  <div class="btn" id="map">MAP</div>
  <div class="btn" id="menu">☰</div>
</div>
<div id="overlay"><div class="card" id="panel"></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W,H, last=0, keys={}, touch={x:0,y:0}, shooting=false;
const world={w:3600,h:2400};
let p={x:1750,y:1250,ang:0,hp:100,st:100,hunger:100,thirst:100,money:42,horse:false,ammo:18};
let horse={x:1810,y:1300,ang:0};
let quest={stage:0,done:false}, loot=[], bullets=[], enemies=[], messages=[];
let discovered=new Set(), time=7.5, weather=0;

const towns=[
 {x:1660,y:1180,name:"Blackridge",r:230},
 {x:650,y:650,name:"Red Creek",r:180},
 {x:2920,y:1760,name:"Mercy Falls",r:190}
];
const landmarks=[
 {x:1100,y:1500,n:"Old Mine"}, {x:2470,y:720,n:"Hunter's Cabin"},
 {x:3100,y:430,n:"Fort Granger"}, {x:850,y:2070,n:"Coyote Camp"}
];
for(let i=0;i<28;i++) loot.push({x:300+Math.random()*3000,y:300+Math.random()*1800,taken:false,type:["Cash","Jerky","Ammo","Herbs"][i%4]});
for(let i=0;i<8;i++) enemies.push({x:500+Math.random()*2800,y:400+Math.random()*1700,hp:40,alive:true,cd:0});

function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}
addEventListener('resize',resize);resize();

function msg(s){messages.unshift({s,t:3.5});messages=messages.slice(0,4)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function sayQuest(){
 if(quest.stage===0){quest.stage=1;msg("QUEST: A Debt in Blood — Find Silas at the Blackridge saloon.");}
 else if(quest.stage===1){quest.stage=2;msg("Silas: Bandits took my sister's locket. Search the old mine.");}
 else if(quest.stage===2){quest.stage=3;msg("You found the locket. Return to Silas in Blackridge.");}
 else if(quest.stage===3){quest.stage=4;p.money+=80;msg("Quest complete! +$80. New leads unlocked.");}
}
function nearestTown(){return towns.reduce((a,b)=>dist(p,b)<dist(p,a)?b:a)}
function interact(){
 let t=nearestTown();
 if(dist(p,t)<140 && t.name==="Blackridge"){ if(quest.stage===0||quest.stage===3||quest.stage===4) sayQuest(); else msg("The saloon is loud tonight. Silas is waiting upstairs.");}
 else if(dist(p,{x:1100,y:1500})<150 && quest.stage===1){quest.stage=2;sayQuest()}
 else {
  let found=loot.find(l=>!l.taken&&dist(p,l)<55);
  if(found){found.taken=true;let gain=found.type==="Cash"?18:0;p.money+=gain;if(found.type==="Ammo")p.ammo+=6;if(found.type==="Jerky")p.hunger=Math.min(100,p.hunger+22);if(found.type==="Herbs")p.hp=Math.min(100,p.hp+12);msg("Looted "+found.type+(gain? " +$"+gain:""))}
 }
}
function shoot(){
 if(p.ammo<=0){msg("Click. You're out of ammunition.");return}
 p.ammo--; bullets.push({x:p.x+Math.cos(p.ang)*28,y:p.y+Math.sin(p.ang)*28,a:p.ang,t:0});
 for(const e of enemies){if(e.alive){let dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy),ad=Math.atan2(dy,dx)-p.ang;ad=Math.atan2(Math.sin(ad),Math.cos(ad));if(d<520&&Math.abs(ad)<.12){e.hp-=40;if(e.hp<=0){e.alive=false;p.money+=12;msg("Outlaw down. +$12");}}}}
}
function toggleHorse(){if(!p.horse&&dist(p,horse)<70){p.horse=true;msg("Mounted. Hold the stick to ride.");}else if(p.horse){p.horse=false;horse.x=p.x;horse.y=p.y+35;msg("Dismounted.");}}
function mapScreen(){
 document.getElementById('overlay').style.display='block';
 document.getElementById('panel').innerHTML='<h1>Frontier Map</h1><p><b>Gold:</b> '+p.money+' &nbsp; <b>Ammo:</b> '+p.ammo+'</p><p><b>Current quest:</b> '+(quest.stage===0?'Speak with Silas in Blackridge':quest.stage===1?'Search the Old Mine':quest.stage===2?'Return the locket to Silas':quest.stage===3?'Return to Silas':'Chapter I complete')+'</p><p>Discovered: '+[...discovered].join(', ')+'</p><hr><p>Explore the wilderness for hidden loot, hunt for survival supplies, and watch your hunger and thirst.</p><button onclick="closeOverlay()">RETURN</button>';
}
function menu(){document.getElementById('overlay').style.display='block';document.getElementById('panel').innerHTML='<h1>Frontier Redemption</h1><p><b>Chapter I: The Long Road</b></p><p>HP '+Math.round(p.hp)+' • Stamina '+Math.round(p.st)+' • Hunger '+Math.round(p.hunger)+' • Thirst '+Math.round(p.thirst)+'</p><p>This is a compact playable prototype. Your save is kept in this browser session.</p><button onclick="closeOverlay()">RESUME</button>'}
function closeOverlay(){document.getElementById('overlay').style.display='none'}
document.getElementById('fire').ontouchstart=e=>{e.preventDefault();shoot()};document.getElementById('fire').onclick=shoot;
document.getElementById('act').ontouchstart=e=>{e.preventDefault();interact()};document.getElementById('act').onclick=interact;
document.getElementById('horse').ontouchstart=e=>{e.preventDefault();toggleHorse()};document.getElementById('horse').onclick=toggleHorse;
document.getElementById('map').onclick=mapScreen;document.getElementById('menu').onclick=menu;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')shoot();if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='h')toggleHorse();if(e.key.toLowerCase()==='m')mapScreen()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let dragging=false;
stick.addEventListener('touchstart',e=>{dragging=true;e.preventDefault()},{passive:false});
addEventListener('touchend',()=>{dragging=false;touch={x:0,y:0};knob.style.transform='translate(0,0)'});
addEventListener('touchmove',e=>{if(!dragging)return;let r=stick.getBoundingClientRect(),q=e.touches[0],dx=q.clientX-(r.left+r.width/2),dy=q.clientY-(r.top+r.height/2),m=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);touch={x:Math.cos(a)*m/42,y:Math.sin(a)*m/42};knob.style.transform=`translate(${touch.x*28}px,${touch.y*28}px)`;e.preventDefault()},{passive:false});

function draw(){
 x.clearRect(0,0,W,H);
 let zoom=p.horse?1.0:.95, vw=W/zoom,vh=H/zoom,cx=p.x,cy=p.y;
 x.save();x.scale(zoom,zoom);x.translate(vw/2-cx,vh/2-cy);
 // ground
 x.fillStyle='#7e704b';x.fillRect(0,0,world.w,world.h);
 // regions
 x.fillStyle='#566b45';x.fillRect(0,0,1200,world.h);
 x.fillStyle='#8d744b';x.fillRect(1200,0,1200,world.h);
 x.fillStyle='#657a53';x.fillRect(2400,0,1200,world.h);
 // river
 x.fillStyle='#385c68';x.beginPath();x.moveTo(1850,0);x.bezierCurveTo(1650,500,2150,800,1900,1200);x.bezierCurveTo(1650,1600,2200,1900,1850,2400);x.lineTo(2050,2400);x.bezierCurveTo(2370,1900,1850,1600,2100,1200);x.bezierCurveTo(2350,800,1850,500,2050,0);x.fill();
 // roads
 x.strokeStyle='#b49b6a';x.lineWidth=22;for(const y of [1180,1500,1760]){x.beginPath();x.moveTo(0,y);x.lineTo(world.w,y);x.stroke()}
 x.strokeStyle='#a58d61';x.lineWidth=14;x.beginPath();x.moveTo(400,2200);x.lineTo(1660,1180);x.lineTo(3000,700);x.stroke();
 // towns
 for(const t of towns){x.fillStyle='#4d3a2a';x.fillRect(t.x-85,t.y-55,170,110);for(let i=-60;i<70;i+=40){x.fillStyle='#9c6e43';x.fillRect(t.x+i,t.y-42,26,34)}x.fillStyle='#f4d69b';x.font='bold 18px Georgia';x.fillText(t.name,t.x-60,t.y+85)}
 // landmarks
 for(const l of landmarks){x.fillStyle='#3b2b20';x.fillRect(l.x-35,l.y-25,70,50);x.fillStyle='#f0d79e';x.font='14px Georgia';x.fillText(l.n,l.x-45,l.y+45)}
 // trees
 for(let i=0;i<150;i++){let tx=(i*271)%world.w,ty=(i*149)%world.h;if(Math.hypot(tx-p.x,ty-p.y)<900){x.fillStyle='#344b31';x.beginPath();x.arc(tx,ty,18,0,7);x.fill();x.fillStyle='#4b3824';x.fillRect(tx-3,ty,6,28)}}
 // loot
 for(const l of loot)if(!l.taken&&dist(p,l)<800){x.fillStyle='#d7ad45';x.fillRect(l.x-6,l.y-6,12,12)}
 // enemies
 for(const e of enemies)if(e.alive){x.fillStyle='#3b1712';x.beginPath();x.arc(e.x,e.y,16,0,7);x.fill();x.fillStyle='#e4c58c';x.fillRect(e.x-12,e.y-25,24,4);x.fillStyle='#8d3025';x.fillRect(e.x-12,e.y-25,24*(e.hp/40),4)}
 // horse
 if(!p.horse){x.fillStyle='#5b3824';x.beginPath();x.ellipse(horse.x,horse.y,32,20,0,0,7);x.fill();x.fillStyle='#2c2119';x.fillRect(horse.x+24,horse.y-17,18,22)}
 // player
 x.save();x.translate(p.x,p.y);x.rotate(p.ang);x.fillStyle='#17130f';x.fillRect(-13,-18,26,36);x.fillStyle='#b78b55';x.fillRect(-18,-22,36,7);x.fillStyle='#5b3824';x.fillRect(8,-4,28,6);x.restore();
 for(const b of bullets){x.fillStyle='#ffd27a';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()}
 x.restore();
 // HUD
 x.fillStyle='#0009';x.fillRect(12,12,245,90);x.fillStyle='#fff';x.font='bold 15px Georgia';x.fillText('FRONTIER REDEMPTION',22,34);x.font='13px Georgia';x.fillText('$'+p.money+'   AMMO '+p.ammo,22,56);
 x.fillStyle='#6b241c';x.fillRect(22,70,190,10);x.fillStyle='#bd4936';x.fillRect(22,70,190*p.hp/100,10);x.fillStyle='#fff';x.fillText('HP',218,80);
 let qtxt=quest.stage===0?'Find Silas • Blackridge':quest.stage===1?'Search the Old Mine':quest.stage===2?'Return the locket':quest.stage===3?'Return to Silas':'Chapter I complete';
 x.fillStyle='#0009';x.fillRect(12,H-62,Math.min(440,W-24),48);x.fillStyle='#f4d99e';x.font='14px Georgia';x.fillText(qtxt,22,H-34);
 let yy=125;for(const m of messages){x.fillStyle='#fff';x.font='13px Georgia';x.fillText(m.s,22,yy);yy+=19}
}
function update(dt){
 time+=dt*.08;if(time>24)time-=24;weather+=dt*.2;
 let dx=(keys.d?1:0)-(keys.a?1:0)+touch.x,dy=(keys.s?1:0)-(keys.w?1:0)+touch.y;
 let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}
 let speed=p.horse?230:150;
 p.x=Math.max(30,Math.min(world.w-30,p.x+dx*speed*dt));p.y=Math.max(30,Math.min(world.h-30,p.y+dy*speed*dt));
 if(len>.1)p.ang=Math.atan2(dy,dx);
 if(p.horse){horse.x=p.x-18;horse.y=p.y+8}
 p.st=Math.max(0,p.st-dt*(len>.1?3:0));p.hunger=Math.max(0,p.hunger-dt*.45);p.thirst=Math.max(0,p.thirst-dt*.7);
 if(p.hunger<15||p.thirst<15)p.hp=Math.max(0,p.hp-dt*1.8);
 for(const e of enemies){if(!e.alive)continue;let d=dist(p,e);if(d<360){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*35*dt;e.y+=Math.sin(a)*35*dt;e.cd-=dt;if(e.cd<=0&&d<300){p.hp=Math.max(0,p.hp-7);e.cd=1.5}}}
 for(const m of messages)m.t-=dt;messages=messages.filter(m=>m.t>0);
 for(const l of loot)if(!l.taken&&dist(p,l)<45&&!discovered.has(l.type)){discovered.add(l.type);msg("You discovered "+l.type+" loot.")}
 for(const lm of landmarks)if(dist(p,lm)<100&&!discovered.has(lm.n)){discovered.add(lm.n);msg("Discovered: "+lm.n)}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
